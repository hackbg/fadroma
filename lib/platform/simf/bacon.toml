default_job = "check"
env.CARGO_TERM_COLOR = "always"
[keybindings]
c = "job:check"
d = "job:doc-open"
t = "job:test"
n = "job:nextest"
l = "job:clippy"
[jobs]
[jobs.check]
command = ["cargo", "check"]
need_stdout = false
watch = ["lib"]
[jobs.clippy-all]
command = ["cargo", "clippy"]
need_stdout = false
watch = ["lib"]
[jobs.test]
command = ["cargo", "test"]
need_stdout = true
watch = ["lib"]
[jobs.doc]
command = ["cargo", "doc", "--no-deps"]
need_stdout = false
[jobs.doc-open]
command = ["cargo", "doc", "--no-deps", "--open"]
need_stdout = false
on_success = "back" # so that we don't open the browser at each change
