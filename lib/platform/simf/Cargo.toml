[package]
name = "fadroma-simf"
version = "0.1.0"
edition = "2021"
resolver = "2"
build = "build.rs"

[lib]
crate-type = [ "cdylib", "rlib" ]

[build-dependencies]
cc = "1"

[dependencies]
simplicityhl = { path = "../../../deps/simplicityhl@5fd6593", features = ["serde"] }
console_error_panic_hook = "0.1.7"
hex = "0.4.3"
js-sys = "0.3.70"
serde_json = "1.0"
wasm-bindgen = "0.2.106"
web-sys = { version = "0.3.70", features = ["console"] }
anyhow = "1"
bitcoin_hashes = "0.14.1"

[profile.release]
debug = true
lto = false

[profile.dev]
lto = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["--enable-bulk-memory-opt", "-O"]

[package.metadata.wasm-pack.profile.dev]
wasm-opt = ["--enable-bulk-memory-opt", "-O3"]

[package.metadata.wasm-pack.profile.dev.wasm-bindgen]
omit-default-module-path = true

[package.metadata.wasm-pack.profile.release.wasm-bindgen]
omit-default-module-path = true
