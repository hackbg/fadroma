<html style="font-size:24px">
  <head>
    <title>Fadroma by Hack.bg</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="logo"></div>
    <section class="box">
      <section style="flex-grow:0;gap:0.5rem">
        <div class="row">
          <div class="field">
            <div class="name">Title</div>
            <div style="display:flex;flex-flow:column">
              <input type="text" focused placeholder="name your project" style="height:2rem;font-size:1rem" />
            </div>
          </div>
          <div class="field">
            <div class="name">License</div>
            <div>
              <select>
                <option>AGPL-3.0-or-later</option>
                <option>AGPL-3.0</option>
                <option>GPL-3.0-or-later</option>
                <option>GPL-3.0</option>
                <option>Closed source (inquire)</option></select>
            </div>
          </div>
        </div>
        <div class="field">
          <div class="name">README</div>
          <div style="display:flex;flex-flow:column">
            <textarea placeholder="describe your project" style="height:2rem;font-size:1rem;width:30rem;height:8rem"></textarea>
          </div>
        </div>
      </section>
      <section>
        <div class="field">
          <div class="name">Integrations</div>
          <div class="row">
            <ul class="features">
              <li class="feature"><label><input type="checkbox" checked style="width:1rem;height:1rem" /> Bitcoin</label></li>
              <li class="feature"><label><input type="checkbox" checked style="width:1rem;height:1rem" /> Simplicity</label></li>
              <li class="feature"><label><input type="checkbox" style="width:1rem;height:1rem" disabled /> Solana</label></li>
              <li class="feature"><label><input type="checkbox" style="width:1rem;height:1rem" disabled /> Tendermint</label></li>
              <li class="feature"><label><input type="checkbox" style="width:1rem;height:1rem" disabled /> CosmWasm</label></li>
            </ul>
            <ul class="features">
              <!--<span style="padding-left:1.65rem;font-size:0.8rem;line-height:1rem">@fadroma/btc</span>-->
              <li class="feature">
                <label><input type="checkbox" style="width:1rem;height:1rem" /> Node.js</label>
                <div class="grow"></div>
                <select><option>Latest</option><option>LTS</option></select>
              </li>
              <li class="feature"><label style="margin-top:0.5rem"><input type="checkbox" checked style="width:1rem;height:1rem" /> Deno</label></li>
              <li class="feature"><label style="margin-top:0.5rem"><input type="checkbox" checked style="width:1rem;height:1rem" /> PNPM</label></li>
            </ul>
            <ul class="features">
              <li class="feature">
                <label><input type="checkbox" checked style="width:1rem;height:1rem" /> Rust</label>
                <div class="grow"></div>
                <select><option>stable</option><option>beta</option><option>nightly</option></select>
              </li>
              <li class="feature"><label><input type="checkbox" style="width:1rem;height:1rem" /> Mold</label></li>
              <li class="feature"><label><input type="checkbox" style="width:1rem;height:1rem" /> Direnv</label></li>
              <li class="feature"><label><input type="checkbox" style="width:1rem;height:1rem" /> Nix</label></li>
              <li class="feature"><label style="opacity:0.5"><input type="checkbox" disabled style="width:1rem;height:1rem;margin-top:0.5rem" /> Flake</label></li>
            </ul>
          </div>
        </div>
      </section>
    </section>
    <div style="margin: 0.5rem">
      <button style="margin: 0 auto">Download project template</button>
    </div>
  </body>
</html>
