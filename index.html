<html style="font-size:24px">
  <body style="margin:none;padding:none;font-family:sans-serif;font-size:24px;color:#555">
    <div style="display: flex;flex-flow: row nowrap;align-items:flex-start; border:1px solid #aaa;margin:1rem 0.5rem;padding:1rem 0.5rem;border-radius:0.5rem;">
      <img style="width:10rem" src="https://fadroma.tech/assets/logo.svg" />
      <div style="display:flex;flex-flow:column;padding:0 1rem;gap:1rem">
        <h1 style="font-size:1.66rem;margin:0.66rem 0 0;font-weight:normal;color:#aaa">
          npm install <a href="https://hack.bg" style="color:rgb(144, 19, 254)">@hackbg</a>/<a href="https://fadroma.tech" style="color:rgb(101, 179, 76);font-weight:normal">fadroma</a>
          <em># or create your project here:</em>
        </h1>
        <div style="display:flex;flex-flow:row nowrap">
          <div style="padding: 1rem 0.5rem 1rem 0;width:7rem;border-right:1px solid #ccc;margin-right:1rem">Title</div>
          <div style="padding: 1rem 0.5rem 1rem 0;display:flex;flex-flow:column">
            <input type="text" focused placeholder="name your project" style="height:2rem;font-size:1rem" />
          </div>
        </div>
        <div style="display:flex;flex-flow:row nowrap">
          <div style="padding: 1rem 0.5rem 1rem 0;width:7rem;border-right:1px solid #ccc;margin-right:1rem">Targets</div>
          <div style="padding: 1rem 0.5rem 1rem 0;width:10rem;border-right:1px solid #ccc;margin-right:1rem;display:flex;flex-flow:column">
            <label><input type="checkbox" checked style="width:1rem;height:1rem" /> Bitcoin</label>
            <span style="padding-left:1.65rem;font-size:0.8rem;line-height:1rem">@fadroma/btc</span>
            <label style="margin-top:0.5rem"><input type="checkbox" checked style="width:1rem;height:1rem" /> Simplicity</label>
            <span style="padding-left:1.65rem;font-size:0.8rem;line-height:1rem">@fadroma/simf</span>
          </div>
          <div style="padding: 1rem 0.5rem 1rem 0;width:10rem;border-right:1px solid #ccc;margin-right:1rem;display:flex;flex-flow:column">
            <label style="opacity:0.5"><input type="checkbox" style="width:1rem;height:1rem" disabled /> Solana</label>
            <span style="padding-left:1.65rem;font-size:0.8rem;line-height:1rem">@fadroma/sol-web3<br />@fadroma/sol-kit<br />coming soon!</span>
            <label style="opacity:0.5;margin-top:0.5rem"><input type="checkbox" style="width:1rem;height:1rem" disabled /> Rust on Solana</label>
            <span style="padding-left:1.65rem;font-size:0.8rem;line-height:1rem">@fadroma/sol-rs<br /></span>
          </div>
          <div style="padding: 1rem 0.5rem 1rem 0;display:flex;flex-flow:column">
            <label style="opacity:0.5"><input type="checkbox" style="width:1rem;height:1rem" disabled /> Tendermint</label>
            <span style="padding-left:1.65rem;font-size:0.8rem;line-height:1rem">@fadroma/tm<br />coming soon!</span>
            <label style="opacity:0.5;margin-top:0.5rem"><input type="checkbox" style="width:1rem;height:1rem" disabled /> Rust on CosmWasm</label>
            <span style="padding-left:1.65rem;font-size:0.8rem;line-height:1rem">@fadroma/cw<br /></span>
          </div>
        </div>
        <div style="display:flex;flex-flow:row nowrap">
          <div style="padding: 1rem 0.5rem 1rem 0;width:7rem;border-right:1px solid #ccc;margin-right:1rem">Uses</div>
          <div style="padding: 1rem 0.5rem 1rem 0;width:10rem;border-right:1px solid #ccc;margin-right:1rem;display:flex;flex-flow:column">
            <label><input type="checkbox" style="width:1rem;height:1rem" /> Node.js</label>
            <select style="margin-left:1.5rem;height:1.5rem;font-size:0.8rem;margin-top:0.25rem;background:#fff;border:1px solid #aaa"><option>Latest</option><option>LTS</option></select>
            <label style="margin-top:0.5rem"><input type="checkbox" checked style="width:1rem;height:1rem" /> Deno</label>
            <label style="margin-top:0.5rem"><input type="checkbox" checked style="width:1rem;height:1rem" /> PNPM</label>
          </div>
          <div style="padding: 1rem 0.5rem 1rem 0;width:10rem;border-right:1px solid #ccc;margin-right:1rem;display:flex;flex-flow:column">
            <label><input type="checkbox" checked style="width:1rem;height:1rem" /> Rust</label>
            <select style="margin-left:1.5rem;height:1.5rem;font-size:0.8rem;margin-top:0.25rem;background:#fff;border:1px solid #aaa"><option>stable</option><option>beta</option><option>nightly</option></select>
          </div>
          <div style="padding: 1rem 0.5rem 1rem 0;width:10rem;display:flex;flex-flow:column">
            <label><input type="checkbox" style="width:1rem;height:1rem" /> Nix</label>
            <label style="opacity:0.5"><input type="checkbox" disabled style="width:1rem;height:1rem;margin-top:0.5rem" /> Flake</label>
          </div>
        </div>
        <div style="display:flex;flex-flow:row nowrap">
          <div style="padding: 1rem 0.5rem 1rem 0;width:7rem;border-right:1px solid #ccc;margin-right:1rem">README</div>
          <div style="padding: 1rem 0.5rem 1rem 0;display:flex;flex-flow:column">
            <textarea placeholder="optional" style="height:2rem;font-size:1rem;width:30rem;height:8rem"></textarea>
          </div>
        </div>
        <div style="display:flex;flex-flow:row nowrap">
          <div style="padding: 1rem 0.5rem 1rem 0;width:7rem;border-right:1px solid #ccc;margin-right:1rem">License</div>
          <div style="padding: 1rem 0.5rem 1rem 0;width:15rem;border-right:1px solid #ccc;margin-right:1rem;display:flex;flex-flow:column">
            <select style="height:1.5rem;font-size:1rem;margin-top:0.25rem;background:#fff;border:1px solid #aaa"><option>GPL-3.0</option><option>GPL-3.0-or-later</option><option>Closed source</option></select>
          </div>
          <div style="padding: 1rem 0.5rem 1rem 0;margin-right:1rem;display:flex;flex-flow:column">
            <button style="margin-top:0.25rem;background:#fff;border:1px solid #aaa;background:#4a4;color:#fff;font-size:1.25rem;padding:0.25rem 1rem;border:none">Create project</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
