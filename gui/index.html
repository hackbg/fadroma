<!doctype html>
<html>
  <head>
    <meta charset="utf8" />
    <title>Fadroma by Hack.bg</title>
    <link rel="stylesheet" href="css/gui.css" />
    <link rel="stylesheet" href="css/nav.css" />
    <link rel="stylesheet" href="css/feat.css" />
    <link rel="stylesheet" href="css/edit.css" />
    <link rel="stylesheet" href="css/doc.css" />
    <link rel="stylesheet" href="css/media.css" />
  </head>
  <body class="align-stretch justify-center">
    <nav class="nav align-start" id="navbar">
      <noscript><strong>Contains JavaScript.</strong><br />Enable JS to proceed.</noscript>
      <div class="col">
        <a class="hackbg subtitle" href="https://hack.bg" style=""><strong>Hack.bg</strong> presents:</a>
        <div class="col">
          <div class="wordmark" data-action="home"></div>
          <span class="subtitle" data-action="home">dApp workbench</span>
        </div>
      </div>
      <nav class="col buttons" id="buttonbar">
        <script type="module">import('./comp/Nav.ts').then(({Nav})=>Nav());</script>
        <button data-action="new"  class="rel"><svg class="icon"><use href="icons.svg#document"></use></svg> New</button>
        <button style="opacity:0.5" data-action="load" class="rel"><svg class="icon"><use href="icons.svg#upload"></use></svg> Load</button>
        <button data-action="save" class="rel"><svg class="icon"><use href="icons.svg#download"></use></svg> Save</button>
        <a data-action="docs" href="/docs/deno/index.html"><svg class="icon"><use href="icons.svg#book"></use></svg> Docs</a>
        <a style="opacity:0.5" data-action="test" href="#"><svg class="icon"><use href="icons.svg#doc"></use></svg> Test</a>
        <a href="/cov/index.html"><svg class="icon"><use href="icons.svg#code"></use></svg> Coverage</a>
      </nav>
    </nav>
    <div class="row justify-center overflow-hidden">
      <div class="row rel gap align-stretch" id="main">
        <section id="editors" class="box">
          <script type="module">import('./comp/Editor.ts').then(({Editor})=>Editor());</script>
        </section>
        <section id="sidebar" class="flex col" style="gap:0.5rem">
          <ul id="features" class="features smol"></ul>
          <script type="module">import('./comp/Config.ts').then(({Config})=>Config());</script>
        </section>
      </div>
    </div>
  </body>
</html>
